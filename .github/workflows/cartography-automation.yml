name: Apex Cartography Automation

on:
  schedule:
    - cron: '0 15 * * *' # Daily at 00:00 KST (15:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cartography:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Cartography Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASK_SALT: ${{ secrets.MASK_SALT || 'apex-vibe-fallback-salt-2026' }}
        run: npm run generate

      - name: Commit and Push Topology Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/ org-map.svg org-map.gif
          if git diff --staged --quiet; then
            echo "No topology mutations detected."
          else
            git commit -m "chore(cartography): update autonomous topology map [skip ci]"
            git push origin main
          fi
