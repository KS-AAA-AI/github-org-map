<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="60%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="24" fill="url(#apexBg)"/>
  <rect x="1.5" y="1.5" width="997" height="477" rx="22.5" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Header HUD -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" fill="url(#neonAccent)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">APEX 자율 토폴로지 매핑 시스템 // V3</text>
    <text x="0" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">KS-AAA-AI 저장소 토폴로지 지도</text>
    <text x="920" y="20" fill="#64748B" font-family="Consolas, monospace" font-size="12" text-anchor="end">SYNC: 2026-09-20</text>
  </g>

  <!-- Metrics Chips -->
  <g transform="translate(40, 115)">
    <!-- Total Chip -->
    <rect x="0" y="0" width="180" height="68" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="20" y="26" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">전체 노드 수</text>
    <text x="20" y="55" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">2</text>

    <!-- Public Chip -->
    <rect x="200" y="0" width="180" height="68" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="220" y="26" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">공개 배포 완료</text>
    <text x="220" y="55" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">2</text>

    <!-- Vault Chip -->
    <rect x="400" y="0" width="180" height="68" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="420" y="26" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">암호화 금고 (Vault)</text>
    <text x="420" y="55" fill="#F43F5E" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">0</text>

    <!-- Tech Stack Summary -->
    <rect x="600" y="0" width="320" height="68" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="620" y="26" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">핵심 기술 스택</text>
    <text x="620" y="52" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">TypeScript (1)  ·  Plain (1)</text>
  </g>

  <!-- Topology Node Rows -->
  
    <g transform="translate(40, 220)">
      <rect width="920" height="36" rx="8" fill="#111C2E" stroke="#0284C7" stroke-width="1.2" opacity="0.95"/>
      <circle cx="20" cy="18" r="4" fill="#10B981"/>
      <text x="36" y="23" fill="#38BDF8" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="600">github-org-map</text>
      <rect x="740" y="8" width="70" height="20" rx="5" fill="#1E293B"/>
      <text x="775" y="22" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">공개</text>
      <text x="890" y="23" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">2026-09-20</text>
    </g>
    <g transform="translate(40, 262)">
      <rect width="920" height="36" rx="8" fill="#111C2E" stroke="#0284C7" stroke-width="1.2" opacity="0.95"/>
      <circle cx="20" cy="18" r="4" fill="#10B981"/>
      <text x="36" y="23" fill="#38BDF8" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="600">KS-AAA-AI</text>
      <rect x="740" y="8" width="70" height="20" rx="5" fill="#1E293B"/>
      <text x="775" y="22" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">공개</text>
      <text x="890" y="23" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">2026-09-20</text>
    </g>

  <!-- Footer Status Bar -->
  <g transform="translate(40, 455)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="16" fill="#475569" font-family="Consolas, monospace" font-size="10">HMAC-SHA256 보안 · 영지식 공개 프로젝션</text>
    <text x="920" y="16" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="end">자율 오케스트레이션 엔진</text>
